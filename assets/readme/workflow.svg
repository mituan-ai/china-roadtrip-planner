<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">免费自驾旅游路线规划器技术结构</title>
  <desc id="desc">浏览器保存行程，Fastify 服务端校验和代理请求，高德 Web 服务返回地点、路线和天气数据。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#07594c"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="18" fill="#f7f9f8"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="58" y="58" fill="#18201e" font-size="42" font-weight="800">数据怎么走</text>
    <text x="58" y="94" fill="#60716b" font-size="20">行程留在浏览器，Web Service Key 留在服务器</text>

    <g transform="translate(58 142)">
      <rect width="294" height="190" rx="12" fill="#fff" stroke="#aebdb7" stroke-width="2"/>
      <rect width="294" height="48" rx="12" fill="#e8f1ed"/>
      <path d="M0 48H294" stroke="#aebdb7" stroke-width="2"/>
      <circle cx="24" cy="24" r="5" fill="#f28c42"/>
      <circle cx="42" cy="24" r="5" fill="#d6dfdb"/>
      <circle cx="60" cy="24" r="5" fill="#d6dfdb"/>
      <text x="24" y="88" fill="#18201e" font-size="26" font-weight="800">浏览器</text>
      <text x="24" y="124" fill="#40504b" font-size="20">React 行程编辑器</text>
      <text x="24" y="156" fill="#40504b" font-size="20">localStorage / URL Hash</text>
    </g>

    <path d="M372 236H460" stroke="#07594c" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="416" y="212" text-anchor="middle" fill="#60716b" font-size="18">API 请求</text>

    <g transform="translate(480 142)">
      <rect width="268" height="190" rx="12" fill="#07594c"/>
      <text x="24" y="56" fill="#fff" font-size="26" font-weight="800">Fastify API</text>
      <text x="24" y="98" fill="#dcebe5" font-size="20">参数校验</text>
      <text x="24" y="130" fill="#dcebe5" font-size="20">限流、缓存、超时</text>
      <text x="24" y="162" fill="#dcebe5" font-size="20">Web Service Key</text>
    </g>

    <path d="M768 236H856" stroke="#07594c" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="812" y="212" text-anchor="middle" fill="#60716b" font-size="18">HTTPS</text>

    <g transform="translate(876 142)">
      <rect width="266" height="190" rx="12" fill="#fff" stroke="#f28c42" stroke-width="3"/>
      <path d="M24 50C49 24 77 24 102 50C77 76 49 76 24 50Z" fill="none" stroke="#f28c42" stroke-width="5"/>
      <circle cx="63" cy="50" r="8" fill="#f28c42"/>
      <text x="24" y="103" fill="#18201e" font-size="26" font-weight="800">高德 Web 服务</text>
      <text x="24" y="140" fill="#40504b" font-size="20">POI / Driving / Weather</text>
    </g>

    <path d="M58 372H1142" stroke="#d5dfdb" stroke-width="2"/>
    <text x="58" y="404" fill="#60716b" font-size="18">坐标系：GCJ-02</text>
    <text x="1142" y="404" text-anchor="end" fill="#60716b" font-size="18">服务端不保存用户行程</text>
  </g>
</svg>
