<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 400px; overflow: hidden; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    .hero { position: relative; width: 1200px; height: 400px; overflow: hidden; border-radius: 18px; background: #f5f6f3 url("hero-map.png") center/cover no-repeat; }
    .copy { position: absolute; left: 58px; top: 50px; width: 585px; }
    .eyebrow { color: #07594c; font-size: 19px; font-weight: 800; }
    h1 { margin: 30px 0 0; color: #18201e; font-size: 50px; line-height: 1.05; letter-spacing: 0; white-space: nowrap; }
    .desc { margin: 22px 0 0; width: 570px; color: #40504b; font-size: 27px; line-height: 1.55; }
    .meta { position: absolute; left: 58px; bottom: 42px; display: flex; gap: 30px; color: #07594c; font-size: 19px; font-weight: 800; }
    .meta span + span::before { content: "\00b7"; margin-right: 30px; color: #f28c42; }
  </style>
</head>
<body>
  <main class="hero">
    <div class="copy">
      <div class="eyebrow">开源 · 不用登录 · 浏览器本地保存</div>
      <h1>免费自驾旅游路线规划器</h1>
      <p class="desc">把起点、景点、景观公路和酒店按天排好，直接看路线、里程和时间。</p>
    </div>
    <div class="meta"><span>全国地点搜索</span><span>住宿衔接两天</span><span>手机跳转高德</span></div>
  </main>
</body>
</html>
