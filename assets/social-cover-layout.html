<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    main { position: relative; width: 1200px; height: 630px; background: #f6f7f5 url("../docs/images/planner-desktop.png") center/cover no-repeat; }
    main::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 34%, rgba(255,255,255,.04) 55%, rgba(255,255,255,.18)); }
    .copy { position: absolute; z-index: 1; top: 28px; right: 28px; width: 540px; padding: 24px 28px 22px; border-left: 6px solid #087664; background: rgba(255,255,255,.94); box-shadow: 0 10px 26px rgba(24,32,30,.12); }
    h1 { margin: 0; color: #18201e; font-size: 42px; line-height: 1.18; letter-spacing: 0; white-space: nowrap; }
    p { margin: 14px 0 0; color: #40504b; font-size: 23px; line-height: 1.45; }
    .url { margin-top: 12px; color: #087664; font-size: 19px; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <section class="copy">
      <h1>免费自驾旅游路线规划器</h1>
      <p>景点、景观公路和酒店按天排，直接看路线、里程和时间。</p>
      <div class="url">trip.yhdmt.site</div>
    </section>
  </main>
</body>
</html>
